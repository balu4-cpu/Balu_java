<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments/layout :: head('Students')}"></head>
<body>
    <nav th:replace="~{admin/fragments/layout :: navbar}"></nav>
    <div class="container">
        <div class="breadcrumb">
            <a th:href="@{/admin/dashboard}">Dashboard</a>
            <span class="separator">/</span>
            <span>Students</span>
        </div>

        <div th:if="${successMessage}" class="alert alert-success">
            ✅ <span th:text="${successMessage}"></span>
        </div>

        <div class="card">
            <div class="card-header">
                <h2>👩‍🎓 Students</h2>
                <div class="actions">
                    <button type="button" onclick="window.print()" class="btn btn-secondary btn-sm">🖨️ Print</button>
                    <a th:href="@{/admin/students/new}" class="btn btn-primary btn-sm">➕ Add Student</a>
                </div>
            </div>
            <div th:if="${students.isEmpty()}">
                <div class="alert alert-info">No students found. Add your first student!</div>
            </div>
            <table th:if="${!students.isEmpty()}">
                <thead>
                    <tr>
                        <th>Roll Number</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Course</th>
                        <th>Year</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="s : ${students}">
                        <td th:text="${s.rollNumber}">CS001</td>
                        <td th:text="${s.name}">Name</td>
                        <td th:text="${s.email}">email</td>
                        <td th:text="${s.course}">Course</td>
                        <td th:text="${s.year}">1</td>
                        <td>
                            <div class="actions">
                                <a th:href="@{/admin/students/{id}(id=${s.id})}" class="btn btn-secondary btn-sm">View</a>
                                <a th:href="@{/admin/students/{id}/edit(id=${s.id})}" class="btn btn-primary btn-sm">Edit</a>
                                <form th:action="@{/admin/students/{id}/delete(id=${s.id})}" method="post"
                                      onsubmit="return confirm('Delete this student?');">
                                    <button type="submit" class="btn btn-danger btn-sm">Delete</button>
                                </form>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
