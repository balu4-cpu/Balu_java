<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments/layout :: head(${isNew} ? 'Add Student' : 'Edit Student')}"></head>
<body>
    <nav th:replace="~{admin/fragments/layout :: navbar}"></nav>
    <div class="container">
        <div class="breadcrumb">
            <a th:href="@{/admin/dashboard}">Dashboard</a>
            <span class="separator">/</span>
            <a th:href="@{/admin/students}">Students</a>
            <span class="separator">/</span>
            <span th:text="${isNew} ? 'Add' : 'Edit'">Add</span>
        </div>

        <div class="card">
            <div class="card-header">
                <h2 th:text="${isNew} ? '➕ Add Student' : '✏️ Edit Student'">Add Student</h2>
            </div>
            <form th:action="${isNew} ? @{/admin/students} : @{/admin/students/{id}(id=${student.id})}"
                  th:object="${student}" method="post">
                <div class="form-row">
                    <div class="form-group">
                        <label for="rollNumber">Roll Number *</label>
                        <input type="text" id="rollNumber" th:field="*{rollNumber}"
                               class="form-control" th:classappend="${#fields.hasErrors('rollNumber')} ? 'is-invalid'" required>
                        <p th:if="${#fields.hasErrors('rollNumber')}" th:errors="*{rollNumber}" class="error-text"></p>
                    </div>
                    <div class="form-group">
                        <label for="name">Name *</label>
                        <input type="text" id="name" th:field="*{name}"
                               class="form-control" th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'" required>
                        <p th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="error-text"></p>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" th:field="*{email}"
                               class="form-control" th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'">
                        <p th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="error-text"></p>
                    </div>
                    <div class="form-group">
                        <label for="course">Course *</label>
                        <input type="text" id="course" th:field="*{course}"
                               class="form-control" th:classappend="${#fields.hasErrors('course')} ? 'is-invalid'" required>
                        <p th:if="${#fields.hasErrors('course')}" th:errors="*{course}" class="error-text"></p>
                    </div>
                </div>
                <div class="form-group" style="max-width:200px;">
                    <label for="year">Year *</label>
                    <input type="number" id="year" th:field="*{year}" min="1" max="6"
                           class="form-control" th:classappend="${#fields.hasErrors('year')} ? 'is-invalid'" required>
                    <p th:if="${#fields.hasErrors('year')}" th:errors="*{year}" class="error-text"></p>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn btn-success" th:text="${isNew} ? 'Create Student' : 'Update Student'">Save</button>
                    <a th:href="@{/admin/students}" class="btn btn-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
