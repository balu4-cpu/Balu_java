<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments/layout :: head(${isNew} ? 'Add Exam' : 'Edit Exam')}"></head>
<body>
    <nav th:replace="~{admin/fragments/layout :: navbar}"></nav>
    <div class="container">
        <div class="breadcrumb">
            <a th:href="@{/admin/dashboard}">Dashboard</a>
            <span class="separator">/</span>
            <a th:href="@{/admin/exams}">Exams</a>
            <span class="separator">/</span>
            <span th:text="${isNew} ? 'Add' : 'Edit'">Add</span>
        </div>

        <div class="card">
            <div class="card-header">
                <h2 th:text="${isNew} ? '➕ Add Exam' : '✏️ Edit Exam'">Add Exam</h2>
            </div>
            <form th:action="${isNew} ? @{/admin/exams} : @{/admin/exams/{id}(id=${exam.id})}"
                  th:object="${exam}" method="post">
                <div class="form-row">
                    <div class="form-group">
                        <label for="examCode">Exam Code *</label>
                        <input type="text" id="examCode" th:field="*{examCode}"
                               class="form-control" th:classappend="${#fields.hasErrors('examCode')} ? 'is-invalid'" required>
                        <p th:if="${#fields.hasErrors('examCode')}" th:errors="*{examCode}" class="error-text"></p>
                    </div>
                    <div class="form-group">
                        <label for="name">Exam Name *</label>
                        <input type="text" id="name" th:field="*{name}"
                               class="form-control" th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'" required>
                        <p th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="error-text"></p>
                    </div>
                </div>
                <div class="form-group">
                    <label for="subject">Subject *</label>
                    <input type="text" id="subject" th:field="*{subject}"
                           class="form-control" th:classappend="${#fields.hasErrors('subject')} ? 'is-invalid'" required>
                    <p th:if="${#fields.hasErrors('subject')}" th:errors="*{subject}" class="error-text"></p>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="date">Date *</label>
                        <input type="date" id="date" th:field="*{date}"
                               class="form-control" th:classappend="${#fields.hasErrors('date')} ? 'is-invalid'" required>
                        <p th:if="${#fields.hasErrors('date')}" th:errors="*{date}" class="error-text"></p>
                    </div>
                    <div class="form-group">
                        <label for="duration">Duration (minutes) *</label>
                        <input type="number" id="duration" th:field="*{duration}" min="1"
                               class="form-control" th:classappend="${#fields.hasErrors('duration')} ? 'is-invalid'" required>
                        <p th:if="${#fields.hasErrors('duration')}" th:errors="*{duration}" class="error-text"></p>
                    </div>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn btn-success" th:text="${isNew} ? 'Create Exam' : 'Update Exam'">Save</button>
                    <a th:href="@{/admin/exams}" class="btn btn-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
