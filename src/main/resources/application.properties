spring.application.name=exam-seating-system

# MySQL (production)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/exam_seating_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:exam_app}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.globally_quoted_identifiers=true

# Thymeleaf
spring.thymeleaf.cache=false

# Enable hidden HTTP method filter (PUT, DELETE via forms)
spring.mvc.hiddenmethod.filter.enabled=true

# Server
server.port=${PORT:8080}

# Local development defaults. Production overrides the password in application-prod.properties.
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:admin123}
